schema_version = "1.3"

[task]
name = "codeprover/trivial-add"
description = "Lean 4 verification task smoke/trivial-add"
keywords = ["lean4", "theorem-proving", "code-prover"]

[metadata]
source_id = "smoke/trivial-add"
source_dataset = "_smoke"

[agent]
timeout_sec = 1200.0

[verifier]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 1800.0

[[environment.mcp_servers]]
name = "lean-lsp"
transport = "stdio"
command = "/usr/local/bin/lean-mcp"
