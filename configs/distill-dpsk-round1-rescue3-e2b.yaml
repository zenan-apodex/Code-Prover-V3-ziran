# Distillation round1 rescue pass 3: the 102 round1 tasks still without a
# clean finish after rescue pass 2: all 102 died on the gateway's bad-body
# 200s (JSONDecodeError), fixed in agent commit d1d654635.
# Backend e2b.dev while the internal Aliyun platform waits on a 4c/8GB
# sandboxset (branch e2b-dev-line). Shared-team caveats still apply:
# sandboxes can be killed by others; rescue again if it happens.
job_name: distill-dpsk-round1-rescue3-e2b
jobs_dir: jobs
n_attempts: 1
# 102 tasks total.
n_concurrent_trials: 102

environment:
  import_path: tools.e2b_env:ACRE2BEnvironment
  override_cpus: 4
  override_memory_mb: 8192
  kwargs:
    generic_template: code-prover-lean-eval-4c8g
    # agent 3600 + verifier 1800 + overhead; sandboxes bill while alive.
    sandbox_timeout_sec: 7200

agents:
  - import_path: agents.thirdparty_agent:ThirdPartyAgent
    model_name: deepseek-v4-pro
    kwargs:
      api_base: https://llm-hub.apodex.app/v1
      api_key: $DPSK_API_KEY
      extra_headers: {"X-Llmhub-Channel": "7"}
      max_api_calls: 384
      max_tokens: 16384
      enable_compaction: false
      save_transcript: true
      # thinking is gateway-default-on; pinned so a default flip can never
      # silently drop the CoT we distill on.
      extra_request_fields: {"thinking": {"type": "enabled"}}

datasets:
  - path: data/coding-v2.1-full-20260721/rounds/round1_rescue3
