# book-v1 distillation, SG chain base (round 2). Split-backend with the JB
# chain (rounds 1/3). Dataset: data/book-v1-20260731 (books-v1 textbook
# theorems, 10,901 specs, seed 20260731, rounds 5000/5000/901).
# SG needs the dnsmasq agent.miro shim after every DSW restart
# (tools/dnsmasq-agent-miro.conf). MUST run with the pinned venv:
#
#   set -a && source .env && set +a && \
#   DISTILL_DATASET=$PWD/data/book-v1-20260731 LABEL_PREFIX=distill-book \
#     PYTHONPATH=$PWD nohup tools/run_math_rounds_on.sh \
#     configs/distill-book-round2-sg.yaml round2 .venv-aliyun/bin/harbor 2 \
#     > jobs/distill-book-sg-chain.log 2>&1 & disown
#
# Resume: same job_name + jobs_dir skips completed trials.

job_name: distill-book-round2-sg
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 500
# env-start timeout headroom for create queueing (07-23 fix)
environment_build_timeout_multiplier: 3

environment:
  import_path: tools.e2b_env:ACRE2BEnvironment
  kwargs:
    generic_template: zenan-allow-internet
    aliyun_cluster: sg
    aliyun_image: miromind-sg-registry-vpc.ap-southeast-1.cr.aliyuncs.com/verifiable-ai-lab/code-prover-lean:latest
    sandbox_timeout_sec: 7200
    claim_timeout_sec: 540   # platform ALB hard-timeouts creates at ~600s
    wait_ready_timeout_sec: 540

agents:
  - import_path: agents.thirdparty_agent:ThirdPartyAgent
    model_name: deepseek-v4-pro
    kwargs:
      api_base: https://llm-hub.apodex.app/v1
      api_key: $DPSK_API_KEY
      extra_headers: {"X-Llmhub-Channel": "7"}
      max_api_calls: 384
      max_tokens: 16384
      enable_compaction: false
      save_transcript: true
      extra_request_fields: {"thinking": {"type": "enabled"}}

datasets:
  - path: data/book-v1-20260731/rounds/round2
