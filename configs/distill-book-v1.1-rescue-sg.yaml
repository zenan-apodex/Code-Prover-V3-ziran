# book-v1.1 rescue: exception trials from round1 (JB) + round2 (SG) rerun on
# SG (SG shows ~6pp higher solve + fewer agent timeouts than JB on this
# dataset — JB pod CPU appears slower). Mix: ~127 tasks killed by the 08-01
# llm-hub 402 window (clean reruns) + ~189 agent timeouts (hard, may time
# out again).
#
#   set -a && source .env && set +a && PYTHONPATH=$PWD \
#     .venv-aliyun/bin/harbor run -c configs/distill-book-v1.1-rescue-sg.yaml

job_name: distill-book-v1.1-rescue-sg
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 350
environment_build_timeout_multiplier: 3

environment:
  import_path: tools.e2b_env:ACRE2BEnvironment
  kwargs:
    generic_template: zenan-allow-internet
    aliyun_cluster: sg
    aliyun_image: miromind-sg-registry-vpc.ap-southeast-1.cr.aliyuncs.com/verifiable-ai-lab/code-prover-lean:latest
    sandbox_timeout_sec: 7200
    claim_timeout_sec: 540
    wait_ready_timeout_sec: 540

agents:
  - import_path: agents.thirdparty_agent:ThirdPartyAgent
    model_name: deepseek-v4-pro
    kwargs:
      api_base: https://llm-hub.apodex.app/v1
      api_key: $DPSK_API_KEY
      extra_headers: {"X-Llmhub-Channel": "7"}
      max_api_calls: 384
      max_tokens: 16384
      enable_compaction: false
      save_transcript: true
      extra_request_fields: {"thinking": {"type": "enabled"}}

datasets:
  - path: data/book-v1.1-unsolved-20260801/rounds/round1_rescue
  - path: data/book-v1.1-unsolved-20260801/rounds/round2_rescue
