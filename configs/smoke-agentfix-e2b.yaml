# One-task e2e smoke for the qwen agent loop changes (truncation nudge +
# spec-guard restore-on-move). Same wiring as prove-verina5-e2b.
#
#   PYTHONPATH=$PWD .venv/bin/harbor run -c configs/smoke-agentfix-e2b.yaml

job_name: smoke-agentfix-e2b
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 1

environment:
  import_path: tools.e2b_env:ACRE2BEnvironment
  override_cpus: 4
  override_memory_mb: 8192

agents:
  - import_path: agents.qwen_native_agent:QwenNativeAgent
    model_name: code-prover-sft
    override_timeout_sec: 14400.0
    kwargs:
      api_base: http://127.0.0.1:8000/v1
      max_api_calls: 384
      max_tokens: 24576
      max_compactions: 6

datasets:
  - path: tasks/verina_canonical_189
    task_names:
      - verina_basic_1
