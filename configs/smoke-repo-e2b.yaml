# repo flavor on E2B smoke (2026-08-05): validates the e2b_env directory-COPY
# replay fix (repo Dockerfiles do `COPY tree/ /task/`; upload_file only
# handled single files) before the distill-dpsk-repo-v1.0 campaign burns
# 12,994 tasks on it. Same agent settings as the campaign config.
#
#   set -a && source .env && set +a && PYTHONPATH=$PWD \
#     .venv/bin/harbor run -c configs/smoke-repo-e2b.yaml

job_name: smoke-repo-e2b
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 8

environment:
  import_path: tools.e2b_env:ACRE2BEnvironment
  override_cpus: 4
  override_memory_mb: 8192
  kwargs:
    generic_template: code-prover-lean-eval-4c8g
    sandbox_timeout_sec: 7200

agents:
  - import_path: agents.thirdparty_agent:ThirdPartyAgent
    model_name: deepseek-v4-pro
    kwargs:
      api_base: https://llm-hub.apodex.app/v1
      api_key: $DPSK_API_KEY
      extra_headers: {"X-Llmhub-Channel": "7"}
      temperature: 0.6
      native_tools: false
      max_api_calls: 384
      max_tokens: 16384
      enable_compaction: true
      save_transcript: true
      extra_request_fields: {"thinking": {"type": "enabled"}}

datasets:
  - path: data/repo-v1.0-20260804/smoke8
