# Distillation round2: generated by tools/distill_ops.py config — edit the
# generator, not this file.
job_name: distill-dpsk-round2
jobs_dir: jobs
n_attempts: 1
# Local docker: keep <=24 — each trial gets its own bridge network and the
# daemon's default address pools cap out at ~31.
n_concurrent_trials: 24

# Resource budget: 4c/8GB per trial => 96 cores / 192GB peak.
environment:
  override_cpus: 4
  override_memory_mb: 8192

agents:
  - import_path: agents.thirdparty_agent:ThirdPartyAgent
    model_name: deepseek-v4-pro
    kwargs:
      api_base: https://llm-hub.apodex.app/v1
      api_key: $DPSK_API_KEY
      extra_headers: {"X-Llmhub-Channel": "7"}
      max_api_calls: 384
      max_tokens: 16384
      enable_compaction: false
      save_transcript: true
      # thinking is gateway-default-on; pinned so a default flip can never
      # silently drop the CoT we distill on.
      extra_request_fields: {"thinking": {"type": "enabled"}}

datasets:
  - path: data/coding-v2.1-full-20260721/rounds/round2
