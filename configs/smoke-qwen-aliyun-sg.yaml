# One-task golden smoke for the production rollout components:
# local SGLang + QwenNativeAgent + the self-hosted Aliyun SG E2B cluster.
# Credentials are loaded from a gitignored .env; never put them here.

job_name: smoke-qwen-aliyun-sg
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 1

environment:
  import_path: tools.e2b_env:ACRE2BEnvironment
  kwargs:
    generic_template: zenan-allow-internet
    aliyun_cluster: sg
    aliyun_image: miromind-sg-registry-vpc.ap-southeast-1.cr.aliyuncs.com/verifiable-ai-lab/code-prover-lean:latest
    sandbox_timeout_sec: 1800
    claim_timeout_sec: 540
    wait_ready_timeout_sec: 540

agents:
  - import_path: agents.qwen_native_agent:QwenNativeAgent
    model_name: code-prover-sft
    override_timeout_sec: 1800.0
    kwargs:
      api_base: http://127.0.0.1:8000/v1
      max_api_calls: 32
      max_tokens: 8192
      enable_compaction: false
      save_transcript: true

datasets:
  - path: tasks/_smoke
    task_names:
      - trivial-add
