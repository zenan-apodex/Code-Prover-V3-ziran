# Distillation v1-unsolved round1: 4,835 coding tasks from Code-Prover-V2
# iter1-4 never-solved (data/coding-v1-unsolved-20260721, same dataset shape
# as coding-v2.2-unsolved). round1 excludes the 1,096 tasks whose upstream
# problem is already in the v2.1/v2.2 campaign (older v1 formalizations,
# likely unprovable — they sit in round2, run only if wanted).
# Backend/shape mirrors distill-dpsk-v2.2-round*.yaml (e2b.dev, 1024 conc).
#
#   set -a && source .env && set +a && PYTHONPATH=$PWD \
#     .venv/bin/harbor run -c configs/distill-dpsk-v1-round1.yaml

job_name: distill-dpsk-v1-round1
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 1024

environment:
  import_path: tools.e2b_env:ACRE2BEnvironment
  override_cpus: 4
  override_memory_mb: 8192
  kwargs:
    generic_template: code-prover-lean-eval-4c8g
    # agent 3600 + verifier 1800 + overhead; sandboxes bill while alive.
    sandbox_timeout_sec: 7200

agents:
  - import_path: agents.thirdparty_agent:ThirdPartyAgent
    model_name: deepseek-v4-pro
    kwargs:
      api_base: https://llm-hub.apodex.app/v1
      api_key: $DPSK_API_KEY
      extra_headers: {"X-Llmhub-Channel": "7"}
      max_api_calls: 384
      max_tokens: 16384
      enable_compaction: false
      save_transcript: true
      # thinking is gateway-default-on; pinned so a default flip can never
      # silently drop the CoT we distill on.
      extra_request_fields: {"thinking": {"type": "enabled"}}

datasets:
  - path: data/coding-v1-unsolved-20260721/rounds/round1
