# Distillation v1-unsolved round1: 4,835 coding tasks from Code-Prover-V2
# iter1-4 never-solved (data/coding-v1-unsolved-20260721, same dataset shape
# as coding-v2.2-unsolved). round1 excludes the 1,096 tasks whose upstream
# problem is already in the v2.1/v2.2 campaign (older v1 formalizations,
# likely unprovable — they sit in round2, run only if wanted).
#
# Backend: internal Aliyun JB cluster, sandboxset zenan-no-internet
# (2c/8GiB, resized 2026-07-23; 500/500 concurrent creates probed OK in 1s).
# no-internet is fine: the agent + DPSK calls run locally, the sandbox only
# compiles Lean (Mathlib baked into the image, pulled from johor ACR).
# MUST run with the pinned venv (py3.12 + e2b==2.23.0):
#
#   set -a && source .env && set +a && PYTHONPATH=$PWD \
#     .venv-aliyun/bin/harbor run -c configs/distill-dpsk-v1-round1.yaml
#
# Resume: same job_name + jobs_dir skips completed trials.

job_name: distill-dpsk-v1-round1
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 500
# env-start timeout 1800s counts time queued on the create_concurrency
# semaphore; at 500 trials / 24 create slots the queue tail exceeds it.
# 3x (=5400s) covers worst-case queueing. Execution timeouts unaffected.
environment_build_timeout_multiplier: 3

environment:
  import_path: tools.e2b_env:ACRE2BEnvironment
  kwargs:
    generic_template: zenan-no-internet
    aliyun_cluster: jb
    aliyun_image: apodex-sandbox-johor-registry-vpc.ap-southeast-8.cr.aliyuncs.com/math-rl/code-prover-lean:latest
    sandbox_timeout_sec: 7200
    claim_timeout_sec: 540   # platform ALB hard-timeouts creates at ~600s
    wait_ready_timeout_sec: 540
    # gate concurrent CREATES so node image caches warm progressively —
    # 500-way cold fan-out stampedes the ACR (2026-07-23 incident);
    # running concurrency stays at n_concurrent_trials.
    create_concurrency: 24

agents:
  - import_path: agents.thirdparty_agent:ThirdPartyAgent
    model_name: deepseek-v4-pro
    kwargs:
      api_base: https://llm-hub.apodex.app/v1
      api_key: $DPSK_API_KEY
      extra_headers: {"X-Llmhub-Channel": "7"}
      max_api_calls: 384
      max_tokens: 16384
      enable_compaction: false
      save_transcript: true
      # thinking is gateway-default-on; pinned so a default flip can never
      # silently drop the CoT we distill on.
      extra_request_fields: {"thinking": {"type": "enabled"}}

datasets:
  - path: data/coding-v1-unsolved-20260721/rounds/round1
