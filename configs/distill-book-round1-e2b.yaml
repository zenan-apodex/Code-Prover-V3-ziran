# book-v1 distillation round 1: 5,000 textbook-theorem tasks on e2b.dev.
# Dataset: data/book-v1-20260731 (books-v1 release, 10,901 accepted specs,
# converted via tools/books_to_math_jsonl.py; rounds_assignment seed 20260731,
# 3 rounds 5000/5000/901). Release was Lean 4.29-validated; 32/32 sample
# compiled clean on our 4.28 image (compile_check.json).
#
#   set -a && source .env && set +a && PYTHONPATH=$PWD \
#     .venv/bin/harbor run -c configs/distill-book-round1-e2b.yaml
#
# Chained rounds (driver materializes + derives round2/3 configs from this):
#   DISTILL_DATASET=$PWD/data/book-v1-20260731 LABEL_PREFIX=distill-book \
#     PYTHONPATH=$PWD nohup tools/run_math_rounds_on.sh \
#     configs/distill-book-round1-e2b.yaml round1 .venv/bin/harbor 1 2 3 \
#     > jobs/distill-book-e2b-chain.log 2>&1 & disown
#
# Resume: same job_name + jobs_dir skips completed trials.

job_name: distill-book-round1-e2b
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 500

environment:
  import_path: tools.e2b_env:ACRE2BEnvironment
  override_cpus: 4
  override_memory_mb: 8192
  kwargs:
    generic_template: code-prover-lean-eval-4c8g
    sandbox_timeout_sec: 7200

agents:
  - import_path: agents.thirdparty_agent:ThirdPartyAgent
    model_name: deepseek-v4-pro
    kwargs:
      api_base: https://llm-hub.apodex.app/v1
      api_key: $DPSK_API_KEY
      extra_headers: {"X-Llmhub-Channel": "7"}
      max_api_calls: 384
      max_tokens: 16384
      enable_compaction: false
      save_transcript: true
      extra_request_fields: {"thinking": {"type": "enabled"}}

datasets:
  - path: data/book-v1-20260731/rounds/round1
