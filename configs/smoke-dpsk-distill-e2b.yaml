# E2B generic-template distillation smoke: one trivial task, deepseek-v4-pro,
# transcript on. Validates the shared-template path end to end (sandbox from
# code-prover-lean-eval-4c8g, Dockerfile COPY replayed at start, MCP bridge,
# verifier grading inside the sandbox).
#
#   PYTHONPATH=$PWD DPSK_API_KEY=... E2B_API_KEY=... \
#     .venv/bin/harbor run -c configs/smoke-dpsk-distill-e2b.yaml

job_name: smoke-dpsk-distill-e2b
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 1

environment:
  import_path: tools.e2b_env:ACRE2BEnvironment
  override_cpus: 4
  override_memory_mb: 8192
  kwargs:
    generic_template: code-prover-lean-eval-4c8g
    sandbox_timeout_sec: 7200

agents:
  - import_path: agents.qwen_native_agent:QwenNativeAgent
    model_name: deepseek-v4-pro
    kwargs:
      api_base: https://llm-hub.apodex.app/v1
      api_key: $DPSK_API_KEY
      tool_primer: true
      extra_headers: {"X-Llmhub-Channel": "7"}
      max_api_calls: 64
      max_tokens: 16384
      enable_compaction: false
      save_transcript: true
      extra_request_fields: {"thinking": {"type": "enabled"}}

datasets:
  - path: tasks/_smoke
