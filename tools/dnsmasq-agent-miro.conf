# Temporary local DNS shim (2026-07-23): this DSW's VPC lost the PrivateZone
# binding for agent.miro (SG e2b cluster). Wildcard-resolve *.agent.miro to
# the SG ALB fronts (verified reachable); forward everything else to VPC DNS.
# Usage: dnsmasq --conf-file=tools/dnsmasq-agent-miro.conf
#        then put "nameserver 127.0.0.1" first in /etc/resolv.conf
# Remove once the platform re-binds the zone to this VPC.
no-resolv
no-hosts
listen-address=127.0.0.1
bind-interfaces
port=53
server=100.100.2.136
server=100.100.2.138
address=/agent.miro/10.102.131.109
address=/agent.miro/10.102.127.39
address=/agent.miro/10.102.46.50
cache-size=1000
